[package]
name = "nla3d-math"
version = "0.1.0"
edition = "2024"

[dependencies]
faer = { version = "0.24.4", default-features = false, features = ["sparse"] }
generic-array = { version = "1.4.5", default-features = false }
log = "0.4"
num-traits = { version = "0.2.19", default-features = false, features = ["libm"] }
platform = { path = "../platform" }

matrixcompare = { version = "0.3.0", optional = true }
proptest = { version = "1.12.0", optional = true }

[dev-dependencies]
criterion = "0.8"
rand = "0.10.3"
nla3d-math = { path = ".", features = ["std", "compare", "proptest"] }
proptest = "1.12.0"

[[bench]]
name = "matmul"
harness = false

[features]
std = ["faer/std", "platform/std", "log/std", "num-traits/std"]
compare = ["dep:matrixcompare", "std"]
proptest = ["dep:proptest", "matrixcompare?/proptest-support", "std"]

[lib]
crate-type = ["rlib", "staticlib"]
