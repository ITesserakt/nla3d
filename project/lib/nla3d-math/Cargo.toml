[package]
name = "nla3d-math"
version = "0.1.0"
edition = "2024"

[dependencies]
faer = { version = "0.24.4", default-features = false, features = ["sparse"] }
generic-array = { version = "1.4.5", default-features = false }
log = "0.4"
platform = { path = "../platform", optional = true }

matrixcompare = { version = "0.3.0", optional = true }

[dev-dependencies]
nla3d-math = { path = ".", features = ["std", "compare"] }

[features]
std = ["faer/std", "platform/std", "log/std"]
compare = ["dep:matrixcompare"]

[lib]
crate-type = ["rlib", "staticlib"]
