[package]
name = "nla3d-math"
version = "0.1.0"
edition = "2024"

[dependencies]
faer = { version = "0.24.4", default-features = false, features = ["sparse"] }
generic-array = { version = "1.4.5", default-features = false }
log = "0.4"
num-traits = { version = "0.2.19", default-features = false, features = ["libm"] }
platform = { path = "../platform" }
rand = { version = "0.10.3", optional = true, default-features = false }

matrixcompare = { version = "0.3.0", optional = true }

[dev-dependencies]
nla3d-math = { path = ".", features = ["std", "compare", "rand"] }

[features]
std = ["faer/std", "platform/std", "log/std", "rand/std", "num-traits/std"]
compare = ["dep:matrixcompare"]
rand = ["dep:rand"]

[lib]
crate-type = ["rlib", "staticlib"]
